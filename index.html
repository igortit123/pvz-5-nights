  if(fl){bat-=5*dt;if(bat<=0){bat=0;fl=false;msg('Батарея села!')}}else bat=Math.min(100,bat+3*dt);
  $('bf').style.width=bat+'%';$('bf').style.background=bat<25?'#e03030':'#2fd36b';
  if(!cur&&!custs.some(c=>c.state==='in')&&!(night===1&&!peek&&t>36)){nc-=dt;if(nc<=0)spawn()}
  if(custs.some(c=>c.state!=='wait')){stT-=dt;if(stT<=0){SFX.step();stT=.45}}
  const pat=17-night;
  for(const c of custs.slice()){const g=c.g;
   if(c.state==='in'){g.position.z+=1.3*dt;g.position.y=Math.abs(Math.sin(tm*8))*.03;if(g.position.z>=-2.4){c.state='wait';cur=c;setScr(c.mon?'OZ-48#0#17':'OZ-'+(10000000+Math.random()*8e7|0),'#6fa8ff')}}
   else if(c.state==='wait'){c.w+=dt;g.position.y=c.mon?0:Math.sin(tm*2)*.008;
    if(g.userData.mon)g.userData.tell.visible=lit(g.position.clone().setY(1.6));
    if(c.w>pat){if(c.mon){lose('Монстр устал ждать и сам зашёл за стойку.')}else{comp++;leave(c);msg('Клиент ушёл, не дождавшись. Жалоба!');SFX.err();check()}}}
   else{g.rotation.y=Math.PI;g.position.z-=1.6*dt;g.position.y=Math.abs(Math.sin(tm*8))*.03;if(g.userData.tell)g.userData.tell.visible=false;if(g.position.z<-4.8){S.remove(g);custs.splice(custs.indexOf(c),1)}}}
  /* монстр на складе: с 3 ночи, выглядывает из-за двери */
  if(!bm.on){bm.next-=dt;if(bm.next<=0){bm.on=true;bm.p=.08;bm.g=0;SFX.creak()}}
  else{if(bg.visible&&lit(bg.position.clone().setY(1.6)))bm.p-=.4*dt;else bm.p+=(.045+(night-2)*.025)*dt;
   if(bm.p>.55&&!bm.g){bm.g=1;SFX.growl()}
   if(bm.p<=0){bm.on=false;bm.p=0;bm.next=Math.max(10,(34-night*4)*(.7+Math.random()*.6));SFX.slam();SFX.hiss()}
   else if(bm.p>=1)lose('Монстр из склада подкрался со спины.')}
  if(t>=T)win();
 }
 if(mode==='play'){const tA=bm.on?.45+Math.min(bm.p,.6)*.9:0;doorA+=(tA-doorA)*Math.min(1,dt*(bm.on?1.2:10));bg.visible=bm.on&&doorA>.3;
  if(bm.on){bg.position.z=5.78-Math.max(0,bm.p-.3)*4.2;bg.position.x=Math.sin(tm*3)*.12}}
 dp.rotation.y=doorA;
 cam.rotation.set(pitch,yaw,0);cam.position.y=1.45+Math.sin(tm*1.3)*.01;
 spot.intensity=(mode==='play'&&fl&&bat>0)?(bat<20?(Math.random()<.5?1.5:.4):2.4):0;
 fh.material.color.setHex(spot.intensity?0xfff3c0:0x444444);
 scanT=Math.max(0,scanT-dt);laser.visible=scanT>0;sc.position.y=-.27+scanT*.05;if(scanT<=0&&Math.random()<.01&&mode==='play')setScr(cur?'КЛИЕНТ У СТОЙКИ':'ГОТОВ');
 lamp.intensity=1.1+(Math.random()<.015?-.8:0);
 R.render(S,cam)}
menu();loop();
}
